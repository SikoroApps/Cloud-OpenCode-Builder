name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4
      - name: Locate Android SDK command-line tools
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set"; exit 1; }
          test -d "$ANDROID_HOME/cmdline-tools" || { echo "cmdline-tools missing"; exit 1; }
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager" || { echo "sdkmanager not found"; exit 1; }
          echo "path=$sdkmanager" >> "$GITHUB_OUTPUT"
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"
      - name: Accept SDK licenses and install platform
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "${{ steps.sdk.outputs.path }}" --licenses > /dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Gradle project
        working-directory: android
        run: ./gradlew projects --no-daemon
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-opencode-unit-test-results
          path: android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
      - name: Run cloud backend core tests
        working-directory: android
        run: ./gradlew :backend:test --no-daemon
      - name: Upload backend core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-opencode-backend-test-results
          path: android/backend/build/test-results/test/*.xml
          if-no-files-found: error
      - name: Run Android lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-opencode-lint
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK package name
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          PACKAGE="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          echo "APK package name: $PACKAGE"
          test "$PACKAGE" = "com.sikorokoro44.cloudopencode.debug"
          echo "Debug APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
      - name: Assert debug APK contains no server secret markers
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          strings="$(unzip -p "$APK" 'classes*.dex' 'resources.arsc' | strings || true)"
          for marker in SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN ESMS_API_KEY service_role sb_secret_ esms_test_ CLOUD_API_KEY; do
            if grep -Fqi "$marker" <<< "$strings"; then
              echo "Client artifact contains server secret marker: $marker" >&2
              exit 1
            fi
          done
          echo "Client artifact secret marker scan passed."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-opencode-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  device-smoke:
    name: Emulator app-launch smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4
      - name: Locate Android SDK command-line tools
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set"; exit 1; }
          test -d "$ANDROID_HOME/cmdline-tools" || { echo "cmdline-tools missing"; exit 1; }
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager" || { echo "sdkmanager not found"; exit 1; }
          echo "path=$sdkmanager" >> "$GITHUB_OUTPUT"
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"
      - name: Install SDK platform and emulator image
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "${{ steps.sdk.outputs.path }}" --licenses > /dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "system-images;android-35;google_apis;x86_64"
      - name: Enable KVM access for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-opencode-device-test-results
          path: android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn

  https-integration:
    name: Android HTTPS backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4
      - name: Locate Android SDK command-line tools
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set"; exit 1; }
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager" || { echo "sdkmanager not found"; exit 1; }
          echo "path=$sdkmanager" >> "$GITHUB_OUTPUT"
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"
      - name: Install SDK platform and emulator image
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "${{ steps.sdk.outputs.path }}" --licenses > /dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "system-images;android-35;google_apis;x86_64"
      - name: Enable KVM access for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
      - name: Start backend with stubbed AI
        working-directory: cloud
        run: |
          set -euo pipefail
          export CLOUD_DB_PATH=/tmp/cloud-opencode-https-integration.sqlite
          export CLOUD_AI_STUB=1
          export CLOUD_IMAGE_GENERATION_STUB=1
          export CLOUD_WEB_SEARCH_STUB=1
          export PORT=8080
          export HOST=127.0.0.1
          nohup node --experimental-strip-types src/index.ts > /tmp/cloud-opencode-https-backend.log 2>&1 &
          echo $! > /tmp/cloud-opencode-https-backend.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/cloud-opencode-https-health.json; then
              cat /tmp/cloud-opencode-https-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cloud-opencode-https-backend.log
          exit 1
      - name: Expose backend over temporary HTTPS tunnel
        run: |
          set -euo pipefail
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          TUNNEL_URL=""
          for tunnel_attempt in $(seq 1 3); do
            if [ -f /tmp/cloudflared.pid ]; then
              kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
            fi
            : > /tmp/cloudflared.log
            nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > /tmp/cloudflared.log 2>&1 &
            echo $! > /tmp/cloudflared.pid
            for attempt in $(seq 1 40); do
              TUNNEL_URL="$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
              if [ -n "$TUNNEL_URL" ] && curl --max-time 5 -fsS "$TUNNEL_URL/health" > /tmp/cloudflared-health.json 2>/dev/null; then
                break
              fi
              TUNNEL_URL=""
              sleep 2
            done
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            echo "Quick tunnel attempt $tunnel_attempt was not reachable; requesting another."
          done
          if [ -z "$TUNNEL_URL" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi
          TUNNEL_HOST="$(printf '%s' "$TUNNEL_URL" | sed -E 's#https://([^/]+)/?#\1#')"
          echo "HTTPS backend: $TUNNEL_URL"
          echo "CLOUD_BASE_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "CLOUD_HOST_ALLOWLIST=$TUNNEL_HOST" >> "$GITHUB_ENV"
      - name: Run Android HTTPS integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.sikorokoro44.cloudopencode.HttpsBackendIntegrationTest --no-daemon
      - name: Upload HTTPS integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-opencode-https-integration-results
          path: android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
      - name: Stop temporary services
        if: always()
        run: |
          for pidfile in /tmp/cloudflared.pid /tmp/cloud-opencode-https-backend.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done