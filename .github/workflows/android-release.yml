name: Android signed release

on:
  workflow_dispatch:
    inputs:
      cloud_base_url:
        description: Public HTTPS backend URL baked into the release APK
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUD_BASE_URL: ${{ inputs.cloud_base_url || vars.CLOUD_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4
      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure all four signing secrets before running this workflow."
            exit 1
          fi
      - name: Require public backend URL
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_BASE_URL:-}" ]; then
            echo "::error::Set the repository variable CLOUD_BASE_URL or pass the cloud_base_url input"
            exit 1
          fi
          case "$CLOUD_BASE_URL" in
            https://*) ;;
            *) echo "::error::CLOUD_BASE_URL must use https"; exit 1 ;;
          esac
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
      - name: Temporary keystore debug
        run: |
          set -euo pipefail
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          ls -la "$RUNNER_TEMP"
          ls -la android | head -20
      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.type=keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
      - name: Verify signed APK signature and checksum
        working-directory: android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test "$PACKAGE" = "com.sikorokoro44.cloudopencode"
          {
            echo "=== apksigner verify --verbose --print-certs ==="
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo "=== aapt dump badging ==="
            "$AAPT" dump badging "$APK"
            echo "=== sha256sum ==="
            sha256sum "$APK"
            echo "=== size ==="
            stat -c '%s bytes' "$APK"
          } | tee apk-release-evidence.txt
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload signed APK verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-evidence
          path: android/apk-release-evidence.txt
          if-no-files-found: error
