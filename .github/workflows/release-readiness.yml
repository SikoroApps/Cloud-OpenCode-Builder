name: Release readiness

# Manual-only gate. Prints names, booleans, HTTP status and blocker codes only.
# Use require_live=true only when the backend and provider keys are actually configured.

on:
  workflow_dispatch:
    inputs:
      app_repo:
        description: Owner/repository that holds the generated Android app signing secrets
        required: false
        default: SikoroApps/Cloud-OpenCode-Builder
        type: string
      require_live:
        description: Fail the workflow when any release prerequisite is missing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Evaluate masked release prerequisites
        env:
          APP_REPO: ${{ inputs.app_repo }}
          GH_TOKEN: ${{ secrets.RELEASE_READINESS_TOKEN || github.token }}
          CLOUD_BASE_URL: ${{ vars.CLOUD_BASE_URL || '' }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUIRE_LIVE: ${{ inputs.require_live && '1' || '0' }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${APP_REPO:-}" ]; then
            args+=(--repo "$APP_REPO")
          fi
          npm run check:release -- "${args[@]}"
