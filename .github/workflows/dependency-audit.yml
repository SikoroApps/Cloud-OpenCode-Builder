name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install locked backend dependencies
        working-directory: cloud
        run: npm ci --ignore-scripts
      - name: Audit backend npm dependencies
        working-directory: cloud
        run: npm audit --omit=dev --audit-level=high
      - name: Audit pinned Gradle coordinates against OSV
        run: node scripts/audit-dependencies.mjs
